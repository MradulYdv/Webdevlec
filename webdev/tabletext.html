<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            border: 2px solid black;
            padding: 5px;
            border-spacing: 2px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

<table>
    <caption style="text-align: center; font-weight: bold;">
    Quarterly Sales Report(INR)
  </caption>
    <tr style="background-color: #444444; color: white;">
        <th>Category</th>
        <th>Product</th>
        <th>Q1 sales</th>
        <th>Q2 sales</th>
    </tr>

    <tr>
        <td rowspan="2">Electronics</td>
        <td>Smartphones</td>
        <td>₹4,72,450</td>
        <td>₹5,85,838</td>
    </tr>

    <tr>
        <td>Laptops</td>
        <td>₹8,03,165</td>
        <td>₹8,59,859</td>
    </tr>

    <tr style="background-color: #e0e0e0; color: #000000;">
        <td colspan="2">Total Gross</td>
        <td>₹12,75,615</td>
        <td>₹14,45,697</td>
    </tr>
</table>

</body>
</html>
