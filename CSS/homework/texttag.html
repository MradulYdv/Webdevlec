
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mradul - My Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2%;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ecedef;
      color: #000;
    }

    h2 {
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: normal;
      margin: 0 0 1rem 0;
    }

    .container {
      position: relative;
      width: 100%;
    }

    .container img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0.5;
    }

    .label {
      position: absolute;
      margin: 0;
      font-size: clamp(0.9rem, 2.2vw, 2rem);
      color: #000;
      white-space: nowrap;
    }

    .top-left {
      top: 4%;
      left: 2%;
    }

    .top-center {
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
    }

    .top-right {
      top: 4%;
      right: 2%;
    }

    .middle-left {
      top: 50%;
      left: 2%;
      transform: translateY(-50%);
    }

    .centered {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .middle-right {
      top: 50%;
      right: 2%;
      transform: translateY(-50%);
    }

    .bottom-left {
      bottom: 4%;
      left: 2%;
    }

    .bottom-center {
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
    }

    .bottom-right {
      bottom: 4%;
      right: 2%;
    }
  </style>
</head>

<body>

  <h2>My Profile</h2>

  <div class="container">

    <img src="image100.jpg" alt="My Profile Image">

    <p class="label top-left">Mradul</p>
    <p class="label top-center">Mradul</p>
    <p class="label top-right">Mradul</p>

    <p class="label middle-left">Mradul</p>
    <p class="label centered">Mradul</p>
    <p class="label middle-right">Mradul</p>

    <p class="label bottom-left">Mradul</p>
    <p class="label bottom-center">Mradul</p>
    <p class="label bottom-right">Mradul</p>

  </div>

</body>
</html>
